name: Bug report
description: Report a reproducible problem in Hymnal Tool.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping us improve Hymnal Tool.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Select...
        3. See...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - Web
        - Windows
        - macOS
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App or commit version
      placeholder: 1.0.0 or commit SHA
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, logs, or device details if helpful. Remove private information first.
